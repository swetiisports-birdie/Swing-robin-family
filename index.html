<title>Swing Robin Family</title>

<style>
[hidden]{display:none!important}
/* Layout: one phone-width app column, centered on wide screens. Sticky bottom nav, bottom sheets for detail and compose. */
:root{
  --bg:#EAF1F5; --surface:#FFFFFF; --ink:#13242D; --muted:#5A6D78; --line:#D3E0E7;
  --egg:#7FB3C9; --egg-deep:#25677F; --egg-tint:#DCEBF2;
  --rust:#BF541F; --rust-tint:#F8E4D8;
  --lime:#C9E64B; --lime-ink:#1F2B05;
  --good:#1E7F4F; --good-tint:#DDF1E5; --warn-tint:#FBEFC9; --warn:#7A5A06;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A20; --surface:#16262E; --ink:#E7F0F3; --muted:#9DB0BA; --line:#27404B;
    --egg:#7FB3C9; --egg-deep:#8FCBE2; --egg-tint:#1D3945;
    --rust:#E9895A; --rust-tint:#3A2419;
    --lime:#C9E64B; --lime-ink:#1F2B05;
    --good:#6FD39E; --good-tint:#16392A; --warn-tint:#3B3010; --warn:#E9C766;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A20; --surface:#16262E; --ink:#E7F0F3; --muted:#9DB0BA; --line:#27404B;
  --egg:#7FB3C9; --egg-deep:#8FCBE2; --egg-tint:#1D3945;
  --rust:#E9895A; --rust-tint:#3A2419;
  --lime:#C9E64B; --lime-ink:#1F2B05;
  --good:#6FD39E; --good-tint:#16392A; --warn-tint:#3B3010; --warn:#E9C766;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--egg-deep);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding:0 16px 120px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:22px} h3{font-size:17px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
.demo-pill{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-tint);color:var(--warn);padding:4px 8px;border-radius:99px}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.next{border-color:var(--egg);box-shadow:0 0 0 3px var(--egg-tint)}
.datebox{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--egg-tint);color:var(--egg-deep);padding:6px 0}
.datebox b{display:block;font-family:var(--font-display);font-size:24px;line-height:1}
.datebox span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--egg-tint);color:var(--egg-deep);white-space:nowrap}
.tag.league{background:var(--rust-tint);color:var(--rust)}
.tag.class{background:var(--warn-tint);color:var(--warn)}
.tag.club{background:var(--good-tint);color:var(--good)}
.tag.when{background:var(--lime);color:var(--lime-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--egg-deep);border-color:var(--egg-deep);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06202B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06202B}}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);width:100%;font-size:17px;font-family:var(--font-display)}
.btn.in{background:var(--good-tint);border-color:var(--good);color:var(--good)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btn.ghost{background:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tile .ic{font-size:22px;line-height:1}
.tile b{font-family:var(--font-display);font-size:16px}
.tile span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--egg-deep);border-color:var(--egg-deep);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06202B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#06202B}}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--surface);margin-left:-8px;background:var(--egg-tint);color:var(--egg-deep)}
.avs .av:first-child{margin-left:0}
.av.c1{background:var(--rust-tint);color:var(--rust)}
.av.c2{background:var(--good-tint);color:var(--good)}
.av.c3{background:var(--warn-tint);color:var(--warn)}
.av.big{width:40px;height:40px;font-size:14px;margin:0;border:0}
.court-banner{border-radius:16px;overflow:hidden;position:relative;background:var(--egg-deep);color:#fff;padding:18px 16px;min-height:96px}
.court-banner svg{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.court-banner b{font-family:var(--font-display);font-size:20px;position:relative;display:block}
.court-banner span{position:relative;font-size:13.5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:500;color:var(--muted);min-height:48px}
.nav button .ic{font-size:20px;line-height:1}
.nav button[aria-current="page"]{color:var(--egg-deep);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.x{border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:16px;flex:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;color:var(--ink);width:100%;min-height:44px}
textarea{min-height:92px;resize:vertical}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.st.in{background:var(--good-tint);color:var(--good)}
.st.out{background:var(--rust-tint);color:var(--rust)}
.st.none{background:var(--bg);color:var(--muted)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.month .dh{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.day{border:1px solid transparent;background:none;border-radius:10px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500}
.day.today{border-color:var(--egg-deep)}
.day[aria-pressed="true"]{background:var(--egg-deep);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:var(--rust)}
.day[aria-pressed="true"] .dot{background:#fff}
.day.off{opacity:.3}
.actionbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;padding:0 16px}
.actionbar .in{max-width:440px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center}
.actionbar .btn{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.actionbar .btn.alt{background:none;border-color:currentColor;color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.mono{font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.hl{animation:hl 2.4s ease-out 1}
@keyframes hl{0%,60%{box-shadow:0 0 0 4px var(--lime)}100%{box-shadow:0 0 0 0 transparent}}
a.link{color:var(--egg-deep);font-weight:700;text-decoration:none}
@media (prefers-reduced-motion: reduce){.hl{animation:none}}
</style>

<style>
[hidden]{display:none!important}
[data-a]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.kid{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--egg-tint);color:var(--egg-deep);white-space:nowrap}
.kid.k2{background:var(--rust-tint);color:var(--rust)}
.kid.k3{background:var(--good-tint);color:var(--good)}
.kid.k0{background:var(--bg);color:var(--muted)}
.datebox.k2{background:var(--rust-tint);color:var(--rust)}
.datebox.k3{background:var(--good-tint);color:var(--good)}
.dots{display:flex;gap:2px;height:6px}
.dot.k1{background:var(--egg-deep)}
.dot.k2{background:var(--rust)}
.dot.k3{background:var(--good)}
.smsb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 8px;min-height:64px;line-height:1.25;text-align:center}
.smsb-t{font-size:15px;font-weight:700}
.smsb-s{font-size:12.5px;font-weight:400;color:var(--muted)}
.coming-n{font-weight:700;font-size:15px;border-bottom:1.5px dotted var(--muted)}
a.btn{color:var(--ink)}
.alert{background:var(--warn-tint);color:var(--warn);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.alert b{display:block}
.private{background:var(--good-tint);color:var(--good);border-radius:12px;padding:10px 12px;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.nav .plus{color:#fff}
.nav .plus .ic{width:42px;height:42px;border-radius:50%;background:var(--egg-deep);display:grid;place-items:center;font-size:24px;margin-top:-14px;border:3px solid var(--surface)}
:root[data-theme="dark"] .nav .plus .ic{color:#06202B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav .plus .ic{color:#06202B}}
</style>

    <div id="logo"></div>
